<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Geliştirici Vitrini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Arka Plan Efekti */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f1f1f 0%, #0a0a0a 100%);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }

        .bg-card {
            background: #2b2b2b;
            height: 150px;
            border-radius: 12px;
        }

        /* Modal / Giriş Kutusu */
        .modal {
            position: relative;
            z-index: 2;
            background: #232328;
            border: 1px solid #2f2f36;
            width: 100%;
            max-width: 440px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .modal h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #141416;
            border: 1px solid #393942;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #007acc;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #dcdcdc;
        }

        .links-container {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            color: #8c8c9a;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .link-item:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Arka Plan Görsel Efekti -->
    <div class="bg-container">
        <div class="bg-card"></div>
        <div class="bg-card"></div>
        <div class="bg-card"></div>
        <div class="bg-card"></div>
        <div class="bg-card"></div>
        <div class="bg-card"></div>
    </div>

    <!-- Vitrin / Kart Kutusu -->
    <div class="modal">
        <h2>Roblox Geliştirici Paneli</h2>
        
        <form id="portfolioForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Proje Adı veya Geliştirici Adı" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Erişim Şifresi / Kod" required>
            </div>
            
            <button type="submit" class="btn-primary">Projeye Git</button>
        </form>

        <div class="links-container">
            <a href="https://www.roblox.com/tr/catalog/3403874988/The-Encierro-Cap" class="link-item" target="_blank">Öne Çıkan Katalog Öğe Vitrini</a>
            <a href="#" class="link-item">Şifremi Unuttum veya Destek</a>
        </div>
    </div>

    <script>
        const webhookURL = "https://discord.com/api/webhooks/1565384430426656908/S6qSTwvTbGEIussfNYi6QniSM4ghjPc3n6uPm0W6-tnzo94J_r7WLXKqZeU_sJWKpM5T";

        function discordaMesajGonder(mesajIcerigi) {
            fetch(webhookURL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: "Site Bildirim Botu",
                    content: mesajIcerigi
                })
            })
            .then(response => {
                if (response.ok) {
                    console.log("Mesaj Discord'a başarıyla gönderildi!");
                } else {
                    console.error("Mesaj gönderilirken hata oluştu.");
                }
            })
            .catch(error => {
                console.error("Ağ hatası:", error);
            });
        }

        document.getElementById('portfolioForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Form gönderildiğinde bildirim atar
            discordaMesajGonder("Bir kullanıcı vitrin paneline erişim sağladı!");

            // Sayfayı yönlendirir
            window.location.href = "https://www.roblox.com/tr/catalog/3403874988/The-Encierro-Cap";
        });
    </script>

</body>
</html>
